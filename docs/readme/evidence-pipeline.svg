<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ContextLens evidence pipeline</title>
  <desc id="desc">Four source layers flow through identity resolution and editorial review into a bilingual street dossier.</desc>
  <rect width="1200" height="390" rx="24" fill="#f2eee5"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif">
    <text x="52" y="56" fill="#172321" font-size="28" font-weight="700">From records to a readable, traceable street history</text>
    <text x="52" y="86" fill="#607078" font-size="16">从分散资料到可阅读、可核验的街道档案</text>
    <g transform="translate(52 126)">
      <rect width="230" height="58" rx="10" fill="#2e5a50"/><text x="18" y="25" fill="white" font-size="15" font-weight="700">Shanghai Library</text><text x="18" y="46" fill="#dce7e3" font-size="13">roads · events · buildings</text>
      <rect y="70" width="230" height="58" rx="10" fill="#315a73"/><text x="18" y="95" fill="white" font-size="15" font-weight="700">Chinese institutions</text><text x="18" y="116" fill="#dce7ed" font-size="13">gazetteers · heritage registers</text>
      <rect y="140" width="230" height="58" rx="10" fill="#d5a75b"/><text x="18" y="165" fill="#172321" font-size="15" font-weight="700">Visual collections</text><text x="18" y="186" fill="#493a22" font-size="13">images · historical maps</text>
      <rect y="210" width="230" height="58" rx="10" fill="#73828b"/><text x="18" y="235" fill="white" font-size="15" font-weight="700">Current geography</text><text x="18" y="256" fill="#eef1f2" font-size="13">orientation · route context</text>
    </g>
    <path d="M310 260H385" stroke="#b84835" stroke-width="5"/><path d="M372 248l18 12-18 12" fill="none" stroke="#b84835" stroke-width="5"/>
    <g transform="translate(405 160)">
      <rect width="218" height="170" rx="16" fill="#fff" stroke="#c9c6bd"/>
      <text x="22" y="38" fill="#b84835" font-size="14" font-weight="700">01 · RESOLVE</text>
      <text x="22" y="72" fill="#172321" font-size="19" font-weight="700">Street identity</text>
      <text x="22" y="100" fill="#607078" font-size="14">current + historical names</text>
      <text x="22" y="128" fill="#172321" font-size="19" font-weight="700">Time and place</text>
      <text x="22" y="151" fill="#607078" font-size="14">dated, bounded, attributed</text>
    </g>
    <path d="M646 246H721" stroke="#b84835" stroke-width="5"/><path d="M708 234l18 12-18 12" fill="none" stroke="#b84835" stroke-width="5"/>
    <g transform="translate(742 160)">
      <rect width="188" height="170" rx="16" fill="#fff" stroke="#c9c6bd"/>
      <text x="22" y="38" fill="#b84835" font-size="14" font-weight="700">02 · EDIT</text>
      <text x="22" y="72" fill="#172321" font-size="19" font-weight="700">Explain relevance</text>
      <text x="22" y="100" fill="#607078" font-size="14">claim → source</text>
      <text x="22" y="128" fill="#172321" font-size="19" font-weight="700">Review twice</text>
      <text x="22" y="151" fill="#607078" font-size="14">Chinese + English</text>
    </g>
    <path d="M952 246H1009" stroke="#b84835" stroke-width="5"/><path d="M996 234l18 12-18 12" fill="none" stroke="#b84835" stroke-width="5"/>
    <g transform="translate(1030 180)">
      <circle cx="64" cy="64" r="64" fill="#101e2b"/>
      <text x="64" y="55" fill="#f2eee5" font-size="17" font-weight="700" text-anchor="middle">Bilingual</text>
      <text x="64" y="80" fill="#f2eee5" font-size="17" font-weight="700" text-anchor="middle">dossier</text>
      <text x="64" y="103" fill="#d5a75b" font-size="13" text-anchor="middle">可阅读 · 可核验</text>
    </g>
  </g>
</svg>
